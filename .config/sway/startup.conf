# Import the live session environment (WAYLAND_DISPLAY, DISPLAY, XDG_CURRENT_DESKTOP,
# SWAYSOCK) into the systemd user manager and D-Bus activation environment.
# Without this, user services like elephant.service start at boot with a stale/missing
# WAYLAND_DISPLAY (defaulting to wayland-0) and fail: the windows provider can't connect,
# and launched apps inherit a broken display env. This must run before those services.
# The `&&` restart ensures elephant/walker re-read the now-correct environment on boot.
exec systemctl --user import-environment WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP SWAYSOCK && \
     dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP SWAYSOCK && \
     systemctl --user restart elephant.service walker.service

# background
exec swaybg -i /home/joe/eye.jpg -m center
# exec swaybg -o eDP-1 -i /home/joe/eye.jpg -m center
# exec swaybg -o HDMI-A-1 -c '#000000' &

# policy kit
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# autorun programs 
exec_always waybar
exec_always nm-applet

# walker launcher (service mode for instant open).
# Managed by systemd user service (walker.service) ordered After=elephant.service
# so it never races elephant's desktop-app indexing on boot. See ~/.config/systemd/user/walker.service

# Idle configuration
exec swayidle -w \
         timeout 300 'swaylock -f -c 000000' \
         timeout 600 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
         before-sleep 'swaylock -f -c 000000'

# opening applications 
exec zen-browser
exec discord
exec spotify-launcher
exec ticktick
exec obsidian
