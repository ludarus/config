confirm_os_window_close 0

font_family JetBrainsMonoNerdFontMono
font_size 20.0

background #000000
background_opacity 0.4

cursor_trail 1
cursor_trail_start_threshold 0
cursor_trail_decay 0.1 0.3

# higher fps
repaint_delay 5

# --- fuzzy directory finder (runs fzf in a clean overlay window) ---
# Remote control lets the overlay send `cd <dir>` back to the launching window.
allow_remote_control yes
listen_on unix:@mykitty

# Ctrl+F: open the fuzzy directory picker in an overlay, then cd in this window.
map ctrl+shift+f launch --type=overlay --cwd=current --allow-remote-control sh /home/joe/scripts/kitty-fcd.sh
