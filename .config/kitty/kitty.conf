confirm_os_window_close 0

# Fix: kitty opening oversized (overflowing its tile) under Hyprland until
# nudged one pixel. With remember_window_size enabled (the default), kitty
# requests a remembered PIXEL size on open; Hyprland applies that before the
# tile geometry settles, so the window overflows until a reconfigure (the
# one-pixel move) snaps it to the tile. Disabling it makes kitty open at a
# fixed small size that Hyprland tiles cleanly on the first frame.
# See https://github.com/kovidgoyal/kitty/issues/5467
remember_window_size no
initial_window_width 640
initial_window_height 400

font_family JetBrainsMonoNerdFontMono
font_size 20.0

background #000000
background_opacity 0.4

cursor_trail 1
cursor_trail_start_threshold 0
cursor_trail_decay 0.1 0.3

# higher fps
repaint_delay 5
